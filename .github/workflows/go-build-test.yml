# Workflow building the golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GO_PACKAGES: ./client/... ./libs/config/... ./libs/db/... ./libs/logger/... ./libs/merkletree/... ./libs/rpcapi/... ./vrfs-api/... ./vrfs-fs/...
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.11'

    - name: Get dependencies
      run: |
        go mod download

    - name: Build
      run: |
        go build -v -o ./dist/vrfs-client ./client
        go build -v -o ./dist/vrfs-fs ./vrfs-fs
        go build -v -o ./dist/vrfs-api ./vrfs-api

    - name: Vet
      run: go vet $GO_PACKAGES

    - name: Test
      run: go test -race -count=1 $GO_PACKAGES

    - name: Smoke test the client CLI
      run: ./dist/vrfs-client -h
