version: "2"

run:
  go: '1.25'
  # timeout for analysis, e.g. 30s, 5m
  timeout: 2m
  # exit code when at least one issue was found, default is 1
  issues-exit-code: 0
  # include test files or not, default is true
  tests: true
  # modules-download-mode: vendor #readonly #|release|vendor

linters:
  default: none
  enable:
    # Style checkers
    - errname # errors prefixed with Err and error types suffixed with Error
    - misspell # finds commonly misspelled words
    - nestif # deeply nested if statements
    - wastedassign # Finds wasted assignment statements

    # Bug finders
    - asciicheck
    - bodyclose # HTTP response body is closed successfully
    - contextcheck # checks non-inherited context
    - errcheck # unchecked errors
    - gosec # inspects source code for security problems
    - govet # suspicious constructs
    - ineffassign # assignments to existing variables are not used
    # - rowserrcheck # Err of rows is checked successfully
    # - sqlclosecheck # sql.Rows and sql.Stmt are closed
    - staticcheck # includes the former gosimple and stylecheck linters
    - unparam # reports unused function parameters
    - unused # unused constants, variables, functions and types

  # The v1 file nested these settings under `linters`, so golangci-lint never
  # applied them. They are kept disabled to preserve the current lint results.
  # settings:
  #   govet:
  #     enable:
  #       - shadow
  #   staticcheck:
  #     checks: ["all", "-ST1000", "-ST1003"]
  #     initialisms: [
  #       "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA",
  #       "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS",
  #       "SIP", "RTP", "AMQP", "DB", "TS",
  #     ]
  #     http-status-code-whitelist: ["200", "400", "404", "500"]
  #   errcheck:
  #     check-type-assertions: true
  #     check-blank: true
  #   misspell:
  #     locale: US

formatters:
  enable:
    - gofmt
    - goimports

# Also not applied by the v1 file, for the same reason.
# issues:
#   max-issues-per-linter: 100
#   max-same-issues: 100
#   fix: false

output:
  formats:
    text:
      path: stdout
      # Print lines of code with issue.
      print-issued-lines: true
      # Print linter name in the end of issue text.
      print-linter-name: true
